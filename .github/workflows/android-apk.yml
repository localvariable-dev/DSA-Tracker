name: Build Tracebook Android APK

on:
  push:
    branches: [mobile-application]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "mobile-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Package the mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Check out Mobile Application branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install mobile app dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle the website for Capacitor
        run: npm run build

      - name: Verify the app script and styles were bundled
        run: |
          test -f dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"

      - name: Create the Android project
        run: npx cap add android

      - name: Sync Tracebook into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tracebook-android-debug
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
